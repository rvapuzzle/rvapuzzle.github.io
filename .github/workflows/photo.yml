name: "Host \u00b7 Publish or update photo"
on:
  workflow_dispatch:
    inputs:
      path:
        description: "Uploaded repository path, e.g. pics/uploads/2027-01-team.jpg"
        required: true
        type: string
      description:
        description: "Describe what is visible for someone who cannot see the photo"
        required: true
        type: string
      caption:
        description: "Optional visible caption"
        required: false
        type: string
      event_id:
        description: "Optional event ID to also show in its event album"
        required: false
        type: string
      results_date:
        description: "For a winners photo only: results date YYYY-MM-DD"
        required: false
        type: string
      place:
        description: "For a winners photo only: placement"
        required: false
        type: choice
        default: "1"
        options: ["1", "2", "3"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: rva-content-edit
  cancel-in-progress: false
jobs:
  edit:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Validate and save form
        env:
          FORM_INPUTS: ${{ toJSON(inputs) }}
        run: python tools/manage.py photo
      - name: Check build before saving changes
        run: python tools/build.py
      - name: Commit content
        run: |
          git config user.name "RVA publishing"
          git config user.email "actions@users.noreply.github.com"
          git add content/
          if ! git diff --cached --quiet; then
            git commit -m "Update photo through host form"
            git push
          fi
  publish:
    needs: edit
    uses: ./.github/workflows/build-deploy.yml
