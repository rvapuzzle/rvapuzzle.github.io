name: "Host \u00b7 Add or edit event"
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Add a new event or edit an existing one"
        required: true
        type: choice
        default: "Add"
        options: ["Add", "Edit"]
      event_id:
        description: "Event ID, e.g. 2027-01-12-basic-city (copy existing URL to edit)"
        required: true
        type: string
      title:
        description: "Event title (blank keeps existing)"
        required: false
        type: string
      date:
        description: "Date: YYYY-MM-DD (blank keeps existing)"
        required: false
        type: string
      start_time:
        description: "Start: 24-hour Richmond time, e.g. 19:00"
        required: false
        type: string
      end_time:
        description: "End: 24-hour Richmond time, e.g. 21:00"
        required: false
        type: string
      saved_venue:
        description: "Saved venue (automatically fills the name and address)"
        required: false
        type: choice
        default: "Keep current / custom"
        options: ["Keep current / custom", "starr-hill", "basic-city"]
      venue:
        description: "Custom venue name (if not using a saved venue)"
        required: false
        type: string
      address:
        description: "Full venue street address, city, state, ZIP"
        required: false
        type: string
      price:
        description: "Price as displayed, e.g. $40 per team (CLEAR removes)"
        required: false
        type: string
      ticket_url:
        description: "Ticket Tailor HTTPS registration link"
        required: false
        type: string
      description:
        description: "Event description (blank uses existing or standard rules)"
        required: false
        type: string
      status:
        description: "Event status"
        required: false
        type: choice
        default: "Keep current"
        options: ["Keep current", "scheduled", "sold_out", "canceled", "postponed"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: rva-content-edit
  cancel-in-progress: false
jobs:
  edit:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Validate and save form
        env:
          FORM_INPUTS: ${{ toJSON(inputs) }}
        run: python tools/manage.py event
      - name: Check build before saving changes
        run: python tools/build.py
      - name: Commit content
        run: |
          git config user.name "RVA publishing"
          git config user.email "actions@users.noreply.github.com"
          git add content/
          if ! git diff --cached --quiet; then
            git commit -m "Update event through host form"
            git push
          fi
  publish:
    needs: edit
    uses: ./.github/workflows/build-deploy.yml
